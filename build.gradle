plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    // Membuka PlayerModel.cloak supaya jubah bisa disembunyikan; lihat berkasnya
    // untuk alasannya.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Jar mod lokal yang ditaruh di folder libs/.
    // flatDir wajib dipakai (bukan files('...')), karena fg.deobf hanya bisa
    // me-remap dependency modul, bukan file lepas.
    flatDir { dir 'libs' }
    // Mod dari CurseForge
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://modmaven.dev' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mod lain untuk dicoba bareng di runClient/runServer.
    // fg.deobf() WAJIB: jar mod produksi memakai nama SRG, sedangkan dev workspace
    // ini memakai mapping official. Tanpa remap, mod yang pakai mixin akan gagal
    // dengan "@Shadow ... was not located in the target class".
    //
    // Dari libs/: koordinatnya 'grup-bebas:<nama-file-tanpa-versi>:<versi>'
    // Contoh untuk libs/curtain-mc1.20.1-1.3.2.jar:
    // runtimeOnly fg.deobf('local:curtain-mc1.20.1:1.3.2')
    //
    // Dari CurseForge, ambil projectId dan fileId dari URL halaman file:
    // runtimeOnly fg.deobf('curse.maven:jei-238222:4712868')
    //
    // Catatan: sebagian mod tetap gagal di dev workspace walau sudah di-deobf,
    // kalau refmap-nya tidak bisa dipetakan penuh ke mapping official (curtain
    // 1.3.2 salah satunya). Untuk mod seperti itu, tes pakai instalasi Forge asli.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
